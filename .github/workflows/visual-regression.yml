name: Visual Regression (Advisory)

on:
  pull_request:
    paths:
      - 'packages/**'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/visual-regression.yml'
      - '!packages/sync-server/**'
      - '!packages/api/**'
      - '!packages/ci-actions/**'
      - '!packages/docs/**'
      - '!packages/eslint-plugin-actual/**'
  workflow_dispatch:

env:
  GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-web:
    name: Build web bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up environment
        uses: ./.github/actions/setup
        with:
          download-translations: 'false'
      - name: Build browser bundle
        # Keep screenshots deterministic and retain the e2e test-file entry point.
        env:
          REACT_APP_NETLIFY: 'true'
        run: yarn build:browser --skip-translations
      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-client-build
          path: packages/desktop-client/build/
          retention-days: 1
          overwrite: true

  vrt:
    name: Visual regression
    runs-on: ubuntu-latest
    needs: build-web
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-jammy
    env:
      E2E_USE_BUILD: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up environment
        uses: ./.github/actions/setup
        with:
          download-translations: 'false'
      - name: Trust the repository directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Download web build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: desktop-client-build
          path: packages/desktop-client/build/
      - name: Set E2E port
        run: echo 'E2E_PORT=3001' >> "$GITHUB_ENV"
      - name: Run VRT Tests
        run: yarn vrt --shard=1/1
      - name: Upload VRT blob report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: vrt-blob-report
          path: packages/desktop-client/blob-report/
          retention-days: 1
          overwrite: true

  merge-vrt:
    name: Merge VRT Reports
    needs: vrt
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up environment
        uses: ./.github/actions/setup
      - name: Download VRT blob report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: packages/desktop-client/all-blob-reports
          name: vrt-blob-report
      - name: Merge reports
        run: yarn workspace @actual-app/web run playwright merge-reports --reporter html ./all-blob-reports
      - name: Upload HTML report
        id: playwright-report-vrt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: html-report--attempt-${{ github.run_attempt }}
          path: packages/desktop-client/playwright-report
          retention-days: 30
          overwrite: true
      - name: Save VRT metadata for comment workflow
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p vrt-metadata
          echo "${PR_NUMBER}" > vrt-metadata/pr-number.txt
          echo "${VRT_RESULT}" > vrt-metadata/vrt-result.txt
          echo "${STEPS_PLAYWRIGHT_REPORT_VRT_OUTPUTS_ARTIFACT_URL}" > vrt-metadata/artifact-url.txt
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          STEPS_PLAYWRIGHT_REPORT_VRT_OUTPUTS_ARTIFACT_URL: ${{ steps.playwright-report-vrt.outputs.artifact-url }}
          VRT_RESULT: ${{ needs.vrt.result }}
      - name: Upload VRT metadata
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vrt-comment-metadata
          path: vrt-metadata/
          retention-days: 1
